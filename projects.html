<script>
function w3_open() {
    document.getElementById("mySidebar").style.display = "block";
}
function w3_close() {
    document.getElementById("mySidebar").style.display = "none";
}

// Carousels: arrow buttons scroll the track; swipe/trackpad scroll works natively
document.querySelectorAll('.cx').forEach(function(cx){
  var t = cx.querySelector('.cx-track');
  var prev = cx.querySelector('.cx-prev');
  var next = cx.querySelector('.cx-next');
  function update(){
    cx.classList.toggle('cx-static', t.scrollWidth <= t.clientWidth + 2);
    prev.disabled = t.scrollLeft <= 2;
    next.disabled = t.scrollLeft + t.clientWidth >= t.scrollWidth - 2;
  }
  prev.addEventListener('click', function(){ t.scrollBy({left: -t.clientWidth * 0.8, behavior:'smooth'}); });
  next.addEventListener('click', function(){ t.scrollBy({left:  t.clientWidth * 0.8, behavior:'smooth'}); });
  t.addEventListener('scroll', update);
  window.addEventListener('resize', update);
  window.addEventListener('load', update);
  update();
});
</script>
